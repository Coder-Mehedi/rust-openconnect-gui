name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package binary
        run: tar czf rust-openconnect-gui-linux-amd64.tar.gz -C target/release rust-openconnect-gui
      - uses: softprops/action-gh-release@v2
        with:
          files: rust-openconnect-gui-linux-amd64.tar.gz
